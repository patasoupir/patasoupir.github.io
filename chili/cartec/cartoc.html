<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prototype mémoire</title>
    <link rel="stylesheet" type="text/css" href="../../header.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../../styleIndexPresentation.css"
    />

    <style>
      #index a:hover {
        color: red;
      }
      .welcome-popup {
        position: fixed;
        top: 0;
        left: 0;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        z-index: 1000;
      }

      .popup-content {
        background-color: rgba(255, 255, 255, 0.849);
        justify-content: center;
        align-items: center;
        position: relative;
        font-family: "Arial", sans-serif;
        box-shadow: 0px 0px 500px rgb(1, 35, 255);
        color: rgb(0, 0, 255);
        display: block;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        padding: 100px;
        font-size: 20px;
      }

      .close-popup {
        font-size: 20px;
        cursor: pointer;
        border: none;
        background: none;
        color: red;
        border-radius: 0;
        box-shadow: 0px 0px 500px rgb(1, 35, 255);
      }
      .close-popup:hover {
        color: white;
      }

      #grand-espace {
        position: relative;
        width: 2000px;
        height: 2000px;
        background: #242424;
        background: radial-gradient(
          circle,
          rgb(255, 255, 255) 0%,
          rgb(191, 193, 247) 13%,
          rgb(255, 247, 2) 93%,
          rgb(243, 101, 6) 100%
        );
      }
      #centre {
        position: absolute;
        top: 1000px;
        left: 1000px;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        display: inline-block;
        box-shadow: 0px 0px 500px rgb(255, 255, 255);
        width: 20px;
        height: 20px;
      }
      #centre:hover {
        cursor: grab;
        background-image: url(img/libertad.jpg);
        background-position: right;
        padding: 60px;
        box-shadow: 0px 0px 100px rgba(241, 1, 1, 0.881);
        transition: ease 5s;
        border-radius: 10rem;
      }
      #centre a {
        color: transparent;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="welcome-popup" id="welcomePopup">
      <div id="#triangle-top"></div>
      <div class="popup-content">
        <p>
          VOUS VOULEZ ENTRER DANS UN CABINET MEDICAL. FAITES ATTENTION, VOUS NE
          L'AVEZ PEUT-ÊTRE PAS PRÉVU.<br /><br /><br />
          <button>
            <a href="https://patasoupir.club1.fr/">FAIRE DEMI-TOUR ?</a>
          </button>
        </p>
        <button class="close-popup" onclick="closePopup()">
          Fermer cette fenêtre et essayer de rentrer dans le cabinet
        </button>
      </div>
    </div>
    <div id="grand-espace">
      <a href="cartuc.html"><div id="centre"></div></a>
    </div>
    <script>
      window.onload = function () {
        window.scrollTo(
          document.getElementById("centre").offsetLeft - window.innerWidth / 2,
          document.getElementById("centre").offsetTop - window.innerHeight / 2,
        );
      };
      // sélection des popups
      const popups = document.querySelectorAll(".popup");

      // bouton fermer
      popups.forEach((p) => {
        const btn = p.querySelector(".closeBtn");
        if (btn) {
          btn.addEventListener("click", () => {
            p.style.display = "none";
          });
        }
      });

      // fonction pour tout fermer
      function closeAllPopups() {
        popups.forEach((p) => {
          p.style.display = "none";
        });
      }

      // fermer en cliquant dehors
      document.addEventListener("click", (e) => {
        if (e.target.tagName.toLowerCase() === "area") return;
        if (e.target.closest && e.target.closest(".popup")) return;
        closeAllPopups();
      });

      // popup au chargement
      function checkFirstVisit() {
        const popup = document.getElementById("welcomePopup");
        if (popup) {
          popup.style.display = "flex";
        }
      }

      function closePopup() {
        const popup = document.getElementById("welcomePopup");
        if (popup) {
          popup.style.display = "none";
        }
      }

      window.addEventListener("load", checkFirstVisit);
    </script>
  </body>
</html>
