    <script>
      function typeWriter(targetSelector, texts) {
        let textIndex = 0;
        let i = 0;

        function loop() {
          const element = document.querySelector(targetSelector);
          const currentText = texts[textIndex];

          if (i < currentText.length) {
            element.innerHTML += currentText.charAt(i);
            i++;

            const randomSpeed = Math.random() * 100 + 50;
            setTimeout(loop, randomSpeed);
          } else {
            setTimeout(() => {
              element.innerHTML = "";
              i = 0;
              textIndex = (textIndex + 1) % texts.length;
              loop();
            }, 1200);
          }
        }

        loop();
      }
